    DatosPersonalesDto:
      type: object
      properties:
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Duarte
        telefono:
          type: string
          description: "Formato internacional E.164: + código de país y número, sin
            espacios."
          example: "+5491123456789"
        tipoInstitucion:
          type: string
          enum: &a8
            - universidad
            - trabajo
            - independiente
        institucion:
          type: string
          description: "Universidad o lugar de trabajo: puede haber profesionales jóvenes."
          example: FADU-UBA
        pais:
          type: string
          example: AR
          description: Código ISO de dos letras. `ZZ` para «Otro».
    InscripcionDto:
      type: object
      properties:
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Duarte
        telefono:
          type: string
          description: "Formato internacional E.164: + código de país y número, sin
            espacios."
          example: "+5491123456789"
        tipoInstitucion:
          type: string
          enum: *a8
        institucion:
          type: string
          description: "Universidad o lugar de trabajo: puede haber profesionales jóvenes."
          example: FADU-UBA
        pais:
          type: string
          example: AR
          description: Código ISO de dos letras. `ZZ` para «Otro».
        correo:
          type: string
          description: "El correo de Google con el que va a entrar. Tiene que ser
            exactamente ese: si después ingresa con otra cuenta, queda afuera."
